<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e2a4a"/>
      <stop offset="50%" stop-color="#07162c"/>
      <stop offset="100%" stop-color="#020813"/>
    </radialGradient>

    <!-- Brain Core Glow -->
    <radialGradient id="brainCoreGlow" cx="45%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0"/>
    </radialGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Profile Shading Gradient -->
    <linearGradient id="profileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="waveIntenseGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle grid/coordinate lines for scientific feel -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" stroke-dasharray="4,6"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke-dasharray="4,6"/>
    <line x1="0" y1="450" x2="800" y2="450" stroke-dasharray="4,6"/>
    <line x1="200" y1="0" x2="200" y2="600" stroke-dasharray="4,6"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke-dasharray="4,6"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke-dasharray="4,6"/>
  </g>

  <!-- Starry neural dust particles -->
  <g fill="#7dd3fc">
    <circle cx="85" cy="120" r="1.5" opacity="0.4"/>
    <circle cx="140" cy="280" r="1.2" opacity="0.6"/>
    <circle cx="210" cy="95" r="2" opacity="0.5"/>
    <circle cx="280" cy="220" r="1.8" opacity="0.7"/>
    <circle cx="580" cy="140" r="2.2" opacity="0.6"/>
    <circle cx="650" cy="240" r="1.5" opacity="0.5"/>
    <circle cx="720" cy="180" r="2" opacity="0.4"/>
    <circle cx="690" cy="380" r="1.8" opacity="0.6"/>
    <circle cx="120" cy="460" r="2.5" opacity="0.3"/>
    <circle cx="540" cy="490" r="1.5" opacity="0.5"/>
    <circle cx="750" cy="480" r="1.2" opacity="0.4"/>
  </g>

  <!-- Large ambient back-glow behind head and brain -->
  <circle cx="390" cy="280" r="210" fill="url(#brainCoreGlow)"/>

  <!-- ==================== HUMAN HEAD PROFILE ==================== -->
  <!-- Facing right, graceful silhouette -->
  <g id="headProfile">
    <!-- Outer profile glow fill -->
    <path d="M 230,580 
             C 240,480 250,420 270,370 
             C 260,330 255,270 265,210 
             C 280,130 330,70 410,55 
             C 490,40 550,85 580,145 
             C 600,185 605,230 580,270 
             C 575,280 570,290 575,300 
             C 585,305 600,312 605,320 
             C 612,328 605,338 590,345 
             C 580,350 585,360 598,368 
             C 605,372 602,382 588,388 
             C 575,392 570,400 580,412 
             C 586,419 578,430 560,438 
             C 540,446 515,450 495,465 
             C 475,480 465,520 460,580 Z" 
          fill="url(#profileGrad)" opacity="0.25"/>

    <!-- Profile outline glowing stroke -->
    <path d="M 230,580 
             C 240,480 250,420 270,370 
             C 260,330 255,270 265,210 
             C 280,130 330,70 410,55 
             C 490,40 550,85 580,145 
             C 600,185 605,230 580,270 
             C 575,280 570,290 575,300 
             C 585,305 600,312 605,320 
             C 612,328 605,338 590,345 
             C 580,350 585,360 598,368 
             C 605,372 602,382 588,388 
             C 575,392 570,400 580,412 
             C 586,419 578,430 560,438 
             C 540,446 515,450 495,465 
             C 475,480 465,520 460,580" 
          fill="none" stroke="#7dd3fc" stroke-width="2.5" filter="url(#softGlow)"/>

    <!-- Chin, neck and jaw fine line detail -->
    <path d="M 560,438 C 520,445 480,425 450,380 C 430,350 425,320 420,290" 
          fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3,3"/>
  </g>

  <!-- ==================== LUMINOUS BRAIN STRUCTURE ==================== -->
  <g id="brainStructure" filter="url(#neonGlow)">
    <!-- Cerebral Cortex Base Fill -->
    <path d="M 330,260 
             C 310,240 305,200 320,165 
             C 340,125 385,100 435,95 
             C 495,90 540,120 560,160 
             C 575,190 575,235 550,265 
             C 530,290 500,295 470,290 
             C 450,285 435,300 420,315 
             C 400,335 375,340 350,320 
             C 335,305 330,280 330,260 Z"
          fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Cerebellum -->
    <path d="M 345,315 
             C 330,325 320,345 330,365 
             C 342,382 370,385 390,375 
             C 405,368 412,350 405,335 
             C 390,325 365,310 345,315 Z"
          fill="#0369a1" fill-opacity="0.4" stroke="#7dd3fc" stroke-width="1.5"/>

    <!-- Brainstem -->
    <path d="M 395,360 C 405,370 410,400 415,440 L 435,440 C 435,400 430,360 418,335 Z"
          fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Gyri / Sulci Convolutions (Brain Folds) -->
    <!-- Frontal Lobe folds -->
    <path d="M 525,145 C 505,155 490,140 470,148 C 455,155 450,175 430,178" fill="none" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 545,180 C 520,185 505,170 480,180 C 465,188 460,205 440,210" fill="none" stroke="#bae6fd" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 540,220 C 525,225 510,210 490,222 C 475,230 465,245 445,240" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 520,255 C 500,260 485,248 465,260" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Parietal & Occipital folds -->
    <path d="M 430,110 C 418,130 400,128 385,145 C 375,158 380,175 365,190" fill="none" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 465,115 C 448,135 435,130 420,150 C 405,165 410,185 395,200" fill="none" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 390,145 C 370,150 350,165 340,185 C 330,205 342,225 335,245" fill="none" stroke="#bae6fd" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 375,195 C 365,210 350,220 355,240 C 358,255 375,260 380,275" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Temporal lobe folds -->
    <path d="M 430,225 C 410,230 400,245 385,250 C 370,255 365,270 350,275" fill="none" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 460,250 C 445,265 425,260 410,280 C 398,295 380,295 365,305" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Cerebellar folia ripples -->
    <path d="M 345,335 C 360,332 375,340 390,338" fill="none" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M 340,350 C 355,348 375,355 392,352" fill="none" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M 348,365 C 362,362 378,368 392,365" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
  </g>

  <!-- Neural synapses glowing points inside brain -->
  <g fill="#ffffff" filter="url(#softGlow)">
    <circle cx="430" cy="178" r="3"/>
    <circle cx="480" cy="180" r="2.5"/>
    <circle cx="505" cy="140" r="3.2"/>
    <circle cx="420" cy="150" r="2.8"/>
    <circle cx="365" cy="190" r="2.2"/>
    <circle cx="465" cy="260" r="3"/>
    <circle cx="380" cy="275" r="2.5"/>
    <circle cx="510" cy="225" r="2.8"/>
  </g>

  <!-- ==================== THETA BRAINWAVE FREQUENCY LINE ==================== -->
  <!-- Prominent sinusoidal waveform traversing the canvas (Theta band: ~4-8 Hz rhythm) -->
  <g id="thetaWaveform" filter="url(#waveIntenseGlow)">
    <!-- Broad glowing aura wave -->
    <path d="M 0,310 
             C 40,310 60,260 90,260 
             C 120,260 140,355 170,355 
             C 200,355 220,270 250,270 
             C 280,270 300,345 330,345 
             C 360,345 380,250 410,250 
             C 440,250 460,365 490,365 
             C 520,365 540,260 570,260 
             C 600,260 620,350 650,350 
             C 680,350 705,275 735,275 
             C 765,275 780,310 800,310" 
          fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.4"/>

    <!-- Sharp primary theta pulse wave -->
    <path d="M 0,310 
             C 40,310 60,260 90,260 
             C 120,260 140,355 170,355 
             C 200,355 220,270 250,270 
             C 280,270 300,345 330,345 
             C 360,345 380,250 410,250 
             C 440,250 460,365 490,365 
             C 520,365 540,260 570,260 
             C 600,260 620,350 650,350 
             C 680,350 705,275 735,275 
             C 765,275 780,310 800,310" 
          fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Ultra-bright white core center line -->
    <path d="M 0,310 
             C 40,310 60,260 90,260 
             C 120,260 140,355 170,355 
             C 200,355 220,270 250,270 
             C 280,270 300,345 330,345 
             C 360,345 380,250 410,250 
             C 440,250 460,365 490,365 
             C 520,365 540,260 570,260 
             C 600,260 620,350 650,350 
             C 680,350 705,275 735,275 
             C 765,275 780,310 800,310" 
          fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Active Wave Pulse Nodes on peaks -->
  <g fill="#ffffff" filter="url(#softGlow)">
    <circle cx="410" cy="250" r="4.5"/>
    <circle cx="490" cy="365" r="4"/>
    <circle cx="570" cy="260" r="3.5"/>
    <circle cx="250" cy="270" r="3.5"/>
  </g>

  <!-- Scientific Frequency Label Overlay (clean, unobtrusive) -->
  <g opacity="0.6" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7dd3fc">
    <text x="35" y="550" letter-spacing="2">THETA FREQUENCY: 6.0 Hz</text>
    <text x="35" y="568" font-size="10" opacity="0.7">DEEP RELAXATION &amp; NEURAL ENTRAINMENT</text>
  </g>
</svg>
