<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="amberBg" cx="52%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#2d1c08"/>
      <stop offset="45%" stop-color="#190e04"/>
      <stop offset="100%" stop-color="#070401"/>
    </radialGradient>

    <!-- Hippocampus Brilliant Gold Glow -->
    <radialGradient id="goldCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="90%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Brain Tissue Shading Gradient -->
    <linearGradient id="cortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#451a03" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1c0a02" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="intenseGoldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="amberSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#amberBg)"/>

  <!-- Neural Mesh / Background Network in Golden Amber -->
  <g stroke="#d97706" stroke-opacity="0.2" stroke-width="0.8">
    <line x1="120" y1="180" x2="220" y2="220"/>
    <line x1="220" y1="220" x2="310" y2="190"/>
    <line x1="220" y1="220" x2="260" y2="340"/>
    <line x1="310" y1="190" x2="420" y2="210"/>
    <line x1="420" y1="210" x2="490" y2="150"/>
    <line x1="490" y1="150" x2="570" y2="190"/>
    <line x1="570" y1="190" x2="680" y2="160"/>
    <line x1="570" y1="190" x2="630" y2="280"/>
    <line x1="630" y1="280" x2="720" y2="340"/>
    <line x1="630" y1="280" x2="560" y2="370"/>
    <line x1="260" y1="340" x2="350" y2="390"/>
    <line x1="350" y1="390" x2="440" y2="360"/>
    <line x1="560" y1="370" x2="650" y2="460"/>
    <line x1="180" y1="420" x2="260" y2="340"/>
    <line x1="680" y1="160" x2="750" y2="240"/>
  </g>

  <!-- Golden Synaptic Nodes in Background -->
  <g fill="#f59e0b">
    <circle cx="120" cy="180" r="2.5" opacity="0.4"/>
    <circle cx="220" cy="220" r="3.5" opacity="0.6"/>
    <circle cx="310" cy="190" r="2" opacity="0.5"/>
    <circle cx="490" cy="150" r="3" opacity="0.6"/>
    <circle cx="570" cy="190" r="4" opacity="0.7"/>
    <circle cx="680" cy="160" r="2.5" opacity="0.5"/>
    <circle cx="630" cy="280" r="3" opacity="0.6"/>
    <circle cx="720" cy="340" r="2" opacity="0.4"/>
    <circle cx="560" cy="370" r="3.2" opacity="0.6"/>
    <circle cx="260" cy="340" r="2.5" opacity="0.5"/>
    <circle cx="350" cy="390" r="3" opacity="0.5"/>
    <circle cx="650" cy="460" r="2" opacity="0.4"/>
  </g>

  <!-- Large Soft Amber Glow radiating from the temporal lobe / hippocampus region -->
  <circle cx="475" cy="340" r="160" fill="url(#goldCoreGlow)" opacity="0.45"/>

  <!-- ==================== HUMAN HEAD PROFILE SILHOUETTE ==================== -->
  <g id="headSilhouette" opacity="0.35" stroke="#f59e0b" stroke-width="1.8" fill="none">
    <path d="M 230,580 
             C 240,480 250,420 270,370 
             C 260,330 255,270 265,210 
             C 280,130 330,70 410,55 
             C 490,40 550,85 580,145 
             C 600,185 605,230 580,270 
             C 575,280 570,290 575,300 
             C 585,305 600,312 605,320 
             C 612,328 605,338 590,345 
             C 580,350 585,360 598,368 
             C 605,372 602,382 588,388 
             C 575,392 570,400 580,412 
             C 586,419 578,430 560,438 
             C 540,446 515,450 495,465 
             C 475,480 465,520 460,580"/>
  </g>

  <!-- ==================== SAGITTAL CROSS-SECTION OF BRAIN ==================== -->
  <g id="sagittalBrain">
    <!-- Cerebral Cortex Boundary -->
    <path d="M 330,260 
             C 305,235 300,190 320,155 
             C 345,115 390,90 445,85 
             C 505,80 550,110 570,150 
             C 585,180 585,225 560,260 
             C 540,285 510,295 480,290 
             C 455,285 440,305 425,320 
             C 405,340 375,345 350,325 
             C 335,310 330,280 330,260 Z"
          fill="url(#cortexGrad)" stroke="#b45309" stroke-width="2"/>

    <!-- Gyri and Sulci anatomical fissures -->
    <g stroke="#d97706" stroke-width="1.4" stroke-opacity="0.65" fill="none" stroke-linecap="round">
      <path d="M 435,95 C 430,120 410,135 395,150 C 385,160 380,180 365,190"/>
      <path d="M 470,95 C 465,125 445,135 435,160 C 425,180 430,200 415,220"/>
      <path d="M 515,110 C 495,135 480,150 465,175 C 455,190 450,210 435,225"/>
      <path d="M 550,145 C 530,165 510,175 490,195 C 475,210 470,230 455,245"/>
      <path d="M 565,195 C 540,205 520,215 500,235"/>
      <path d="M 350,170 C 340,195 345,215 335,235"/>
      <path d="M 380,225 C 365,245 350,260 345,285"/>
    </g>

    <!-- Corpus Callosum (C-shaped white matter arch) -->
    <path d="M 370,250 
             C 380,210 420,185 470,185 
             C 510,185 535,205 535,230 
             C 530,235 520,235 515,225 
             C 495,200 465,200 430,205 
             C 395,210 375,230 365,255 Z"
          fill="#d97706" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.8" filter="url(#amberSoftGlow)"/>

    <!-- Thalamus (Central oval core) -->
    <ellipse cx="455" cy="255" rx="35" ry="24" 
             fill="#78350f" fill-opacity="0.5" stroke="#d97706" stroke-width="1.5"/>

    <!-- Cerebellum (Posterior-inferior brain) -->
    <path d="M 345,315 
             C 325,330 315,355 328,380 
             C 342,400 375,405 398,390 
             C 415,380 420,355 410,335 
             C 390,325 365,310 345,315 Z"
          fill="#451a03" fill-opacity="0.6" stroke="#b45309" stroke-width="1.8"/>

    <!-- Cerebellar folia internal branching (Arbor Vitae) -->
    <g stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" fill="none">
      <path d="M 390,345 C 375,350 355,340 338,348"/>
      <path d="M 385,360 C 370,365 350,360 335,370"/>
      <path d="M 375,375 C 365,380 352,385 342,392"/>
    </g>

    <!-- Brainstem & Pons descending -->
    <path d="M 425,295 
             C 435,310 445,330 445,350 
             C 445,370 435,395 430,440 
             L 405,440 
             C 405,390 400,360 410,325 Z"
          fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- ==================== HIGHLIGHTED HIPPOCAMPUS (SEAHORSE STRUCTURE) ==================== -->
  <!-- Prominently featured, curved horn-shaped anatomy in radiant gold/yellow -->
  <g id="hippocampusStructure" filter="url(#intenseGoldGlow)">
    <!-- Hippocampal Outer Glow Silhouette -->
    <path d="M 445,295 
             C 430,300 420,315 425,335 
             C 430,355 450,370 475,375 
             C 505,380 535,365 545,340 
             C 552,325 548,310 535,305 
             C 520,300 505,310 495,320 
             C 485,330 470,335 455,330 
             C 445,325 442,315 450,305 
             C 455,298 452,295 445,295 Z"
          fill="#fef08a" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Internal Dentate Gyrus & Cornu Ammonis detail rings -->
    <path d="M 438,328 C 445,345 465,355 488,355 C 510,355 528,345 532,330" 
          fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 452,318 C 460,332 475,340 495,338 C 510,336 520,325 522,318" 
          fill="none" stroke="#fffbeb" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Radiant High-Energy Focus Points along the hippocampus -->
    <circle cx="430" cy="335" r="4" fill="#ffffff"/>
    <circle cx="475" cy="368" r="5" fill="#ffffff"/>
    <circle cx="530" cy="335" r="4.5" fill="#ffffff"/>
    <circle cx="495" cy="320" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Golden Neural Projections emanating from Hippocampus to Neocortex -->
  <g stroke="#fef08a" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round" filter="url(#amberSoftGlow)">
    <!-- Fornix tract projection arching up -->
    <path d="M 445,295 C 440,265 455,235 480,220" stroke-dasharray="4,4"/>
    <!-- Projections into entorhinal cortex and temporal lobe -->
    <path d="M 535,340 C 560,350 585,340 605,325"/>
    <path d="M 475,375 C 485,405 510,425 535,435"/>
    <path d="M 425,335 C 395,350 375,370 360,400"/>
  </g>

  <!-- Radiating Sparkles / Synaptic Bursts around the Hippocampus -->
  <g fill="#ffffff">
    <circle cx="460" cy="275" r="2.2"/>
    <circle cx="510" cy="275" r="2.5"/>
    <circle cx="560" cy="320" r="2"/>
    <circle cx="550" cy="370" r="2.2"/>
    <circle cx="485" cy="410" r="2"/>
    <circle cx="410" cy="365" r="2.5"/>
  </g>

  <!-- Scientific Label Overlay -->
  <g opacity="0.65" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fef08a">
    <text x="35" y="550" letter-spacing="2">REGION: HIPPOCAMPUS (CORPUS AMMONIS)</text>
    <text x="35" y="568" font-size="10" opacity="0.7">MEMORY CONSOLIDATION &amp; THETA RHYTHM PACEMAKER</text>
  </g>
</svg>
